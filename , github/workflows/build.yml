name: VoxelVerse 2.0 — Ultimate Production Build

on:
  workflow_dispatch:

jobs:
  build-release:
    name: Build Optimized Release APK & AAB
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3-stable

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Debug Keystore for Signing
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot/

      - name: Export Android APK (Optimized 150MB-200MB)
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/VoxelVerse_Release.apk

      - name: Verify APK Integrity
        run: |
          ls -lh build/android/VoxelVerse_Release.apk
          file build/android/VoxelVerse_Release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-2.0-Production-APK
          path: build/android/VoxelVerse_Release.apk
          retention-days: 30
