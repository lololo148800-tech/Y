name: VoxelVerse Final Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup
        run: |
          sudo apt-get update && sudo apt-get install -y wget python3 ffmpeg openjdk-17-jdk
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux_x86_64.zip
          unzip Godot_v4.3-stable_linux_x86_64.zip
          sudo mv Godot_v4.3-stable_linux_x86_64 /usr/local/bin/godot
          
          mkdir -p $HOME/.config/godot
          keytool -genkeypair -noprompt -v -keystore $HOME/.config/godot/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VoxelVerse"
          
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"\nexport/android/android_sdk_path = "/usr/local/lib/android/sdk"\nexport/android/debug_keystore = "'$HOME'/.config/godot/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' > $HOME/.config/godot/editor_settings-4.3.tres

      - name: Assets
        run: |
          wget -q "https://files.manuscdn.com/user_upload_by_module/session_file/310519663886992990/onktkgFtPgiZDpFS.zip" -O engine.zip
          unzip -q engine.zip -d tmp && (cp -r tmp/voxel_source/* . 2>/dev/null || cp -r tmp/* . 2>/dev/null || true)
          rm -rf tmp engine.zip
          cat > export_presets.cfg <<'PRESETS'
[preset.0]
name="Android"
platform="Android"
runnable=true
export_path="build/android/VoxelVerse_2.0_Integrity.apk"
[preset.0.options]
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
keystore/debug="$HOME/.config/godot/debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
keystore/release="$HOME/.config/godot/debug.keystore"
keystore/release_user="androiddebugkey"
keystore/release_password="android"
package/unique_name="com.voxelverse.game"
package/name="VoxelVerse 2.0"
PRESETS
          sed -i "s|\$HOME|$HOME|g" export_presets.cfg

      - name: Build
        run: |
          chmod +x ci_build_helper.sh
          ./ci_build_helper.sh

      - uses: actions/upload-artifact@v4
        with:
          name: VoxelVerse-APK
          path: build/android/*.apk
