name: VoxelVerse Final Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup
        run: |
          apt-get update && apt-get install -y wget python3 ffmpeg
          mkdir -p /root/.config/godot
          keytool -genkeypair -noprompt -v -keystore /root/.config/godot/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=VoxelVerse"
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"\nexport/android/android_sdk_path = "/usr/lib/android-sdk"\nexport/android/debug_keystore = "/root/.config/godot/debug.keystore"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' > /root/.config/godot/editor_settings-4.3.tres

      - name: Assets
        run: |
          wget -q "https://files.manuscdn.com/user_upload_by_module/session_file/310519663886992990/onktkgFtPgiZDpFS.zip" -O engine.zip
          unzip -q engine.zip -d tmp && mv tmp/voxel_source/* . || mv tmp/* .
          rm -rf tmp engine.zip

      - name: Build
        run: |
          chmod +x ci_build_helper.sh
          ./ci_build_helper.sh

      - uses: actions/upload-artifact@v4
        with:
          name: VoxelVerse-APK
          path: build/android/*.apk
