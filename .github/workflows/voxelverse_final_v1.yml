name: VoxelVerse Build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    defaults:
      run:
        shell: bash
    env:
      HOME: /github/home
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          apt-get update && apt-get install -y wget python3 ffmpeg
          wget -q "https://files.manuscdn.com/user_upload_by_module/session_file/310519663886992990/vKStvlJmXrHcMSJA.zip" -O engine.zip
          mkdir -p tmp
          unzip -q engine.zip -d tmp
          # Копируем всё кроме .github, чтобы не было конфликтов
          cp -r tmp/* . 2>/dev/null || true
          rm -rf tmp engine.zip
          
          mkdir -p /github/home/.config/godot
          mkdir -p /github/home/.local/share/godot/export_templates/4.3.stable
          cp -r .godot_config/config/* /github/home/.config/godot/
          
          TEMPLATE_PATH=$(find /root -name "android_debug.apk" | xargs dirname | head -n 1)
          if [ -n "$TEMPLATE_PATH" ]; then
            cp -r $TEMPLATE_PATH/* /github/home/.local/share/godot/export_templates/4.3.stable/
          fi
          
      - name: Build
        run: |
          chmod +x ci_build_helper.sh
          ./ci_build_helper.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VoxelVerse-APK
          path: build/android/*.apk
