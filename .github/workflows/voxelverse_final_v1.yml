name: VoxelVerse Final Build
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Android SDK, Java and signing key
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends wget ca-certificates python3 ffmpeg
          mkdir -p "/root/.config/godot" "/root/.local/share/godot/export_templates"
          keytool -genkeypair -noprompt -v \
            -keystore "/root/.config/godot/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=VoxelVerse Integrity,O=VoxelVerse,C=US"
          cat > "/root/.config/godot/editor_settings-4.3.tres" <<SETTINGS
[gd_resource type="EditorSettings" format=3]
[resource]
export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
export/android/android_sdk_path = "/usr/lib/android-sdk"
export/android/debug_keystore = "/root/.config/godot/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
SETTINGS

      - name: Download and Extract Master Project (~3.9GB)
        run: |
          set -euo pipefail
          wget --continue --tries=20 --waitretry=10 --timeout=120 --read-timeout=120 \
            --progress=dot:giga --output-document=engine.zip \
            "https://files.manuscdn.com/user_upload_by_module/session_file/310519663886992990/onktkgFtPgiZDpFS.zip"
          unzip -q -o engine.zip -d extracted_root
          shopt -s dotglob nullglob
          if [ -d "extracted_root/voxel_source" ]; then
              mv extracted_root/voxel_source/* .
          else
              mv extracted_root/* .
          fi
          rm -rf extracted_root engine.zip
          
          # Force create export_presets.cfg
          printf '%s\n' \
            '[preset.0]' 'name="Android"' 'platform="Android"' 'runnable=true' \
            'export_path="build/android/VoxelVerse_2.0_Integrity.apk"' \
            '[preset.0.options]' \
            'architectures/armeabi-v7a=false' 'architectures/arm64-v8a=true' \
            'keystore/debug="/root/.config/godot/debug.keystore"' \
            'keystore/debug_user="androiddebugkey"' \
            'keystore/debug_password="android"' \
            'keystore/release="/root/.config/godot/debug.keystore"' \
            'keystore/release_user="androiddebugkey"' \
            'keystore/release_password="android"' \
            'package/unique_name="com.voxelverse.game"' \
            'package/name="VoxelVerse 2.0"' \
            > export_presets.cfg

      - name: Build and Export
        run: |
          chmod +x ci_build_helper.sh
          ./ci_build_helper.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxelVerse-2.0-APK
          path: build/android/VoxelVerse_2.0_Integrity.apk
          compression-level: 0
