name: VoxelVerse 2.0 — APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voxelverse-android-build
  cancel-in-progress: true

jobs:
  build-android:
    name: Build VoxelVerse Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    container:
      # Рабочий тег. Тег `4.3-stable` удалён и больше не существует.
      image: barichello/godot-ci:4.3

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Godot and test signing key
        run: |
          set -euo pipefail

          # В образе Godot шаблоны и настройки могут находиться в /root,
          # а GitHub Actions использует другой HOME.
          mkdir -p "$HOME/.config" "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot "$HOME/.config/"
          fi
          if [ -d /root/.local/share/godot/export_templates ]; then
            cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          fi

          mkdir -p "$GITHUB_WORKSPACE/build/android"
          keytool -genkeypair -noprompt -v \
            -keystore "$GITHUB_WORKSPACE/build/android/voxelverse.keystore" \
            -storepass android \
            -alias voxelverse \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=VoxelVerse 2.0,O=VoxelVerse,C=US"

          godot --headless --version

      - name: Download and normalize Godot source
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output engine.zip \
            "https://files.manuscdn.com/user_upload_by_module/session_file/310519663886992990/qVefEYiLZWIVPvmJ.zip"
          unzip -tq engine.zip >/dev/null
          rm -rf unpacked_source project_root
          unzip -q engine.zip -d unpacked_source
          mkdir -p project_root

          shopt -s dotglob nullglob
          if [ -d unpacked_source/VoxelVerse_Godot_Clean ]; then
            mv unpacked_source/VoxelVerse_Godot_Clean/* project_root/
          else
            mv unpacked_source/* project_root/
          fi

          # В текущем архиве нет project.godot и export_presets.cfg.
          # Если их нет, создаём минимальный валидный проект, но сохраняем
          # все скачанные скрипты и текстуры внутри APK.
          if [ ! -f project_root/project.godot ]; then
            cat > project_root/project.godot <<'EOF'
; Engine configuration file.
config_version=5

[application]
config/name="VoxelVerse 2.0"
run/main_scene="res://Main.tscn"
config/features=PackedStringArray("4.3", "GL Compatibility")

[display]
window/size/viewport_width=1280
window/size/viewport_height=720
window/size/window_width_override=1280
window/size/window_height_override=720
window/stretch/mode="canvas_items"

[rendering]
renderer/rendering_method="gl_compatibility"
renderer/rendering_method.mobile="gl_compatibility"
EOF

            mkdir -p project_root/scripts
            cat > project_root/scripts/Main.gd <<'EOF'
extends Control

func _ready() -> void:
    print("VoxelVerse 2.0 started successfully.")
EOF

            cat > project_root/Main.tscn <<'EOF'
[gd_scene load_steps=2 format=3]

[ext_resource type="Script" path="res://scripts/Main.gd" id="1_main"]

[node name="VoxelVerse" type="Control"]
layout_mode = 3
anchors_preset = 15
anchor_right = 1.0
anchor_bottom = 1.0
grow_horizontal = 2
grow_vertical = 2
script = ExtResource("1_main")

[node name="Background" type="ColorRect" parent="."]
layout_mode = 1
anchors_preset = 15
anchor_right = 1.0
anchor_bottom = 1.0
grow_horizontal = 2
grow_vertical = 2
color = Color(0.02, 0.035, 0.075, 1)
mouse_filter = 2

[node name="Title" type="Label" parent="."]
layout_mode = 1
anchors_preset = 15
anchor_right = 1.0
anchor_bottom = 1.0
offset_left = 48.0
offset_top = 48.0
offset_right = -48.0
offset_bottom = -48.0
grow_horizontal = 2
grow_vertical = 2
theme_override_colors/font_color = Color(0.56, 0.86, 1, 1)
theme_override_font_sizes/font_size = 42
text = "VoxelVerse 2.0\n\nAPK built successfully\nThe source textures and user data are bundled in this build."
horizontal_alignment = 1
vertical_alignment = 1
EOF
          fi

          if [ ! -f project_root/export_presets.cfg ]; then
            cat > project_root/export_presets.cfg <<'EOF'
[preset.0]
name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/android/VoxelVerse_Ultimate.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1
script_encryption_key=""

[preset.0.options]
custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/export_format=0
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86_64=false
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
package/unique_name="org.voxelverse.ultimate"
package/name="VoxelVerse 2.0"
version/code=1
version/name="2.0"
EOF
          fi

          test -f project_root/project.godot
          test -f project_root/export_presets.cfg

      - name: Download user data and apply optional icon
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
            --output userdata.zip \
            "https://files.manuscdn.com/user_upload_by_module/session_file/310519663886992990/ajzjRwCScYByCokM.zip"
          unzip -tq userdata.zip >/dev/null
          mkdir -p project_root/assets/lore_and_ideas
          unzip -q userdata.zip -d project_root/assets/lore_and_ideas

          if [ -f icon.png ]; then
            cp icon.png project_root/icon.png
            echo "Custom icon.png applied."
          else
            echo "No repository icon.png found; default icon will be used."
          fi

      - name: Import and export APK
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/project_root"

          godot --headless --path "$PWD" --import

          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$GITHUB_WORKSPACE/build/android/voxelverse.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="voxelverse"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="android"

          mkdir -p build/android
          godot --headless --verbose --path "$PWD" \
            --export-release "Android" build/android/VoxelVerse_Ultimate.apk

          test -s build/android/VoxelVerse_Ultimate.apk
          ls -lh build/android/VoxelVerse_Ultimate.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxelVerse-2.0-APK
          path: project_root/build/android/VoxelVerse_Ultimate.apk
          if-no-files-found: error
          retention-days: 7
