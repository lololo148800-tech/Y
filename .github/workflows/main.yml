name: VoxelVerse 2.0 - PERSISTENCE EDITION

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: voxelverse-persistence-android
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Persistence Edition Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: barichello/godot-ci:4.3

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android SDK, Java and signing key
        run: |
          set -euo pipefail

          if ! command -v wget >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends wget ca-certificates
          fi

          export ANDROID_HOME="/usr/lib/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$ANDROID_HOME/cmdline-tools/cmdline-tools/bin:$ANDROID_HOME/platform-tools:$JAVA_HOME/bin:$PATH"
          export SDKMANAGER="$ANDROID_HOME/cmdline-tools/cmdline-tools/bin/sdkmanager"

          test -x "$SDKMANAGER"
          set +e
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          sdkmanager_status="${PIPESTATUS[1]}"
          set -e
          test "$sdkmanager_status" -eq 0 || { echo "sdkmanager license setup failed with status $sdkmanager_status"; exit "$sdkmanager_status"; }
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

          for required_file in \
            "$JAVA_HOME/bin/java" \
            "$ANDROID_HOME/platform-tools/adb" \
            "$ANDROID_HOME/platforms/android-34/android.jar" \
            "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          do
            test -e "$required_file" || { echo "Missing required Android tool: $required_file"; exit 1; }
          done

          mkdir -p "$HOME/.config/godot" "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.local/share/godot/export_templates ]; then
            cp -a /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          fi

          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<'GODOT_SETTINGS'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          GODOT_SETTINGS

          mkdir -p "$GITHUB_WORKSPACE/build/android"
          keytool -genkeypair -noprompt -v \
            -keystore "$GITHUB_WORKSPACE/build/android/persistence-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=VoxelVerse Persistence,O=VoxelVerse,C=US"

          java -version
          godot --headless --version
          df -h "$GITHUB_WORKSPACE"

      - name: Download and unpack Persistence Edition
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          echo "Downloading Persistence Edition archive (~3.94 GB)..."
          wget --continue --tries=20 --waitretry=10 --timeout=120 --read-timeout=120 \
            --progress=dot:giga \
            --output-document=engine.zip \
            "https://files.manuscdn.com/user_upload_by_module/session_file/310519663886992990/JIBPHKvkfFmSZfDZ.zip"

          test -s engine.zip
          unzip -tq engine.zip >/dev/null
          zipinfo -t engine.zip

          rm -rf unpacked_source project_root
          unzip -q engine.zip -d unpacked_source
          mkdir -p project_root

          shopt -s dotglob nullglob
          project_file="$(find unpacked_source -type f -name project.godot -print -quit)"
          if [ -z "$project_file" ]; then
            echo "ERROR: project.godot was not found in Persistence Edition archive."
            echo "The archive must contain a complete Godot project, not only assets."
            find unpacked_source -maxdepth 3 -type f | sed -n '1,120p'
            exit 1
          fi

          project_dir="$(dirname "$project_file")"
          mv "$project_dir"/* project_root/

          test -f project_root/project.godot
          if [ ! -f project_root/export_presets.cfg ]; then
            echo "Android export preset is missing; creating a clean Android preset."
            printf '%s\n' \
              '[preset.0]' \
              'name="Android"' \
              'platform="Android"' \
              'runnable=true' \
              'advanced_options=false' \
              'dedicated_server=false' \
              'custom_features=""' \
              'export_filter="all_resources"' \
              'include_filter=""' \
              'exclude_filter=""' \
              'export_path="build/android/VoxelVerse_2.0_Persistence.apk"' \
              'encryption_include_filters=""' \
              'encryption_exclude_filters=""' \
              'encrypt_pck=false' \
              'encrypt_directory=false' \
              'script_export_mode=1' \
              'script_encryption_key=""' \
              '' \
              '[preset.0.options]' \
              'custom_template/debug=""' \
              'custom_template/release=""' \
              'gradle_build/use_gradle_build=false' \
              'gradle_build/export_format=0' \
              'architectures/armeabi-v7a=true' \
              'architectures/arm64-v8a=true' \
              'architectures/x86_64=false' \
              'keystore/debug=""' \
              'keystore/debug_user=""' \
              'keystore/debug_password=""' \
              'keystore/release=""' \
              'keystore/release_user=""' \
              'keystore/release_password=""' \
              'package/unique_name="org.voxelverse.persistence"' \
              'package/name="VoxelVerse Persistence Edition"' \
              'version/code=1' \
              'version/name="2.0 Persistence"' \
              > project_root/export_presets.cfg
          fi

          echo "--- Project files ---"
          find project_root -maxdepth 3 -type f \
            | grep -E '(project\.godot|export_presets\.cfg|\.tscn)$' \
            | sort \
            | sed -n '1,160p' || echo "(совпадений по маске не найдено)"
          echo "--- Project size ---"
          du -sh project_root

      - name: Validate, import and export Persistence APK
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/project_root"
          mkdir -p build/android

          godot --headless --path "$PWD" --editor --quit \
            2>&1 | tee "$GITHUB_WORKSPACE/build/android/godot-preflight.log"

          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$GITHUB_WORKSPACE/build/android/persistence-debug.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="android"

          godot --headless --path "$PWD" --import \
            2>&1 | tee "$GITHUB_WORKSPACE/build/android/godot-import.log"

          godot --headless --verbose --path "$PWD" \
            --export-release "Android" build/android/VoxelVerse_2.0_Persistence.apk \
            2>&1 | tee build/android/godot-export.log

          test -s build/android/VoxelVerse_2.0_Persistence.apk
          ls -lh build/android/VoxelVerse_2.0_Persistence.apk
          sha256sum build/android/VoxelVerse_2.0_Persistence.apk \
            | tee build/android/VoxelVerse_2.0_Persistence.apk.sha256

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VoxelVerse-Persistence-build-diagnostics
          path: |
            build/android/*.log
            build/android/*.sha256
            project_root/project.godot
            project_root/export_presets.cfg
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Persistence APK
        uses: actions/upload-artifact@v4
        with:
          name: VoxelVerse-2.0-Persistence-APK
          path: project_root/build/android/VoxelVerse_2.0_Persistence.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
