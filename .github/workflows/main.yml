name: VoxelVerse 2.0 — Ultimate Production Build

on:
  workflow_dispatch:

jobs:
  build-release:
    name: Build Optimized Release APK & AAB
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3-stable

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Debug Keystore for Signing
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot/

      - name: Export Android APK (Optimized 150MB-200MB)
        run: |
          mkdir -p build/android
          godot --headless --export-release "Android" build/android/VoxelVerse_Release.apk

      - name: Verify APK Integrity
        run: |
          ls -lh build/android/VoxelVerse_Release.apk
          file build/android/VoxelVerse_Release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-2.0-Production-APK
          path: build/android/VoxelVerse_Release.apk
          retention-days: 30
          unzip -q -o "$PROJECT_ZIP" -d unpacked

          echo "Extracted project:"
          find unpacked -maxdepth 2 -type d -print


      # ============================================================
      # 6. VALIDATE PROJECT
      # ============================================================

      - name: Validate Project
        run: |
          set -e

          if [ ! -d "$PROJECT_DIR" ]; then
            echo "ERROR: Project directory not found:"
            echo "$PROJECT_DIR"
            echo
            echo "Available directories:"
            find unpacked -maxdepth 3 -type d -print
            exit 1
          fi

          echo "Project found:"
          ls -lah "$PROJECT_DIR"

          echo
          echo "C++ files:"
          find "$PROJECT_DIR/src" \
            -type f \
            \( \
              -name "*.cpp" \
              -o -name "*.cc" \
              -o -name "*.c" \
              -o -name "*.h" \
              -o -name "*.hpp" \
            \) \
            -print 2>/dev/null || true


      # ============================================================
      # 7. CREATE ANDROID PROJECT
      # ============================================================

      - name: Create Android Gradle Project
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf android_app

          mkdir -p android_app

          cd android_app

          mkdir -p \
            app/src/main/java/com/voxelverse/minecraft2 \
            app/src/main/cpp \
            app/src/main/assets \
            app/src/main/res/values \
            app/src/main/res/drawable


      # ============================================================
      # 8. SETTINGS.GRADLE
      # ============================================================

      - name: Create Gradle Settings
        run: |
          cd "$PROJECT_DIR/android_app"

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Minecraft2Android"

          include(":app")
          EOF


      # ============================================================
      # 9. ROOT BUILD.GRADLE
      # ============================================================

      - name: Create Root Gradle Build
        run: |
          cd "$PROJECT_DIR/android_app"

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF


      # ============================================================
      # 10. GRADLE PROPERTIES
      # ============================================================

      - name: Create Gradle Properties
        run: |
          cd "$PROJECT_DIR/android_app"

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

          android.useAndroidX=true
          android.nonTransitiveRClass=true

          org.gradle.parallel=true
          org.gradle.caching=true
          EOF


      # ============================================================
      # 11. APP BUILD.GRADLE
      # ============================================================

      - name: Create Android App Build
        run: |
          cd "$PROJECT_DIR/android_app"

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {

              namespace 'com.voxelverse.minecraft2'

              compileSdk 35

              defaultConfig {

                  applicationId 'com.voxelverse.minecraft2'

                  minSdk 24

                  targetSdk 35

                  versionCode 200

                  versionName '2.0.0'

                  ndk {
                      abiFilters 'arm64-v8a'
                  }

                  externalNativeBuild {
                      cmake {
                          cppFlags '-std=c++17 -O3'
                      }
                  }
              }

              buildTypes {

                  debug {
                      minifyEnabled false
                  }

                  release {

                      minifyEnabled false

                      shrinkResources false

                      proguardFiles(
                          getDefaultProguardFile(
                              'proguard-android-optimize.txt'
                          ),
                          'proguard-rules.pro'
                      )
                  }
              }

              externalNativeBuild {

                  cmake {
                      path file('src/main/cpp/CMakeLists.txt')
                      version '3.31.6'
                  }
              }

              packaging {

                  jniLibs {
                      useLegacyPackaging = false
                  }
              }
          }

          dependencies {

              implementation 'androidx.core:core-ktx:1.15.0'

              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          touch app/proguard-rules.pro


      # ============================================================
      # 12. MANIFEST
      # ============================================================

      - name: Create Android Manifest
        run: |
          cd "$PROJECT_DIR/android_app"

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Minecraft 2.0"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      # ============================================================
      # 13. THEME
      # ============================================================

      - name: Create Android Theme
        run: |
          cd "$PROJECT_DIR/android_app"

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:windowFullscreen">true</item>

                  <item name="android:windowActionModeOverlay">true</item>

                  <item name="android:colorAccent">#FFFFFF</item>

              </style>

          </resources>
          EOF


      # ============================================================
      # 14. COPY ASSETS
      # ============================================================

      - name: Copy Game Assets
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -d assets ]; then

            echo "Copying assets..."

            cp -r assets/. \
              android_app/app/src/main/assets/

          else

            echo "No assets directory found."

          fi

          echo
          echo "Assets size:"

          du -sh \
            android_app/app/src/main/assets \
            2>/dev/null || true


      # ============================================================
      # 15. COPY C++ ENGINE
      # ============================================================

      - name: Prepare C++ Engine
        run: |
          set -e

          cd "$PROJECT_DIR/android_app"

          if [ ! -f ../src/GameEngine.cpp ]; then

            echo "ERROR:"
            echo "../src/GameEngine.cpp not found."

            find ../src \
              -type f \
              -print \
              2>/dev/null || true

            exit 1

          fi

          cp \
            ../src/GameEngine.cpp \
            app/src/main/cpp/GameEngine.cpp

          echo "GameEngine.cpp copied."


      # ============================================================
      # 16. JNI BRIDGE
      # ============================================================

      - name: Create JNI Bridge
        run: |
          cd "$PROJECT_DIR/android_app"

          cat > app/src/main/cpp/native-lib.cpp <<'EOF'
          #include <jni.h>
          #include <android/log.h>

          #define LOG_TAG "Minecraft2"

          #define LOGI(...) \
              __android_log_print( \
                  ANDROID_LOG_INFO, \
                  LOG_TAG, \
                  __VA_ARGS__ \
              )

          extern "C"
          JNIEXPORT void JNICALL
          Java_com_voxelverse_minecraft2_MainActivity_nativeInit(
              JNIEnv*,
              jobject
          ) {

              LOGI(
                  "Minecraft 2.0 native engine initialized"
              );

          }

          extern "C"
          JNIEXPORT void JNICALL
          Java_com_voxelverse_minecraft2_MainActivity_nativeShutdown(
              JNIEnv*,
              jobject
          ) {

              LOGI(
                  "Minecraft 2.0 native engine shutdown"
              );

          }
          EOF


      # ============================================================
      # 17. CMAKE
      # ============================================================

      - name: Create CMake Configuration
        run: |
          cd "$PROJECT_DIR/android_app"

          cat > app/src/main/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)

          project(voxelengine)

          set(CMAKE_CXX_STANDARD 17)

          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          set(CMAKE_CXX_FLAGS_RELEASE
              "${CMAKE_CXX_FLAGS_RELEASE} -O3"
          )

          add_library(

              voxelengine

              SHARED

              native-lib.cpp

              GameEngine.cpp

          )

          find_library(

              log-lib

              log

          )

          target_link_libraries(

              voxelengine

              ${log-lib}

          )
          EOF


      # ============================================================
      # 18. MAIN ACTIVITY
      # ============================================================

      - name: Create MainActivity
        run: |
          cd "$PROJECT_DIR/android_app"

          cat > app/src/main/java/com/voxelverse/minecraft2/MainActivity.kt <<'EOF'
          package com.voxelverse.minecraft2

          import android.app.Activity
          import android.os.Bundle
          import android.view.Window
          import android.view.WindowManager

          class MainActivity : Activity() {

              companion object {

                  init {
                      System.loadLibrary("voxelengine")
                  }

              }

              private external fun nativeInit()

              private external fun nativeShutdown()

              override fun onCreate(
                  savedInstanceState: Bundle?
              ) {

                  super.onCreate(savedInstanceState)

                  requestWindowFeature(
                      Window.FEATURE_NO_TITLE
                  )

                  window.setFlags(

                      WindowManager.LayoutParams.FLAG_FULLSCREEN,

                      WindowManager.LayoutParams.FLAG_FULLSCREEN

                  )

                  nativeInit()
              }

              override fun onDestroy() {

                  nativeShutdown()

                  super.onDestroy()
              }

          }
          EOF


      # ============================================================
      # 19. GENERATE GRADLE WRAPPER
      # ============================================================

      - name: Generate Gradle Wrapper
        run: |
          set -e

          cd "$PROJECT_DIR/android_app"

          gradle wrapper \
            --gradle-version 8.11.1 \
            --distribution-type bin

          chmod +x gradlew


      # ============================================================
      # 20. GRADLE CACHE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ============================================================
      # 21. DEBUG BUILD
      # ============================================================

      - name: Build Debug APK
        run: |
          set -e

          cd "$PROJECT_DIR/android_app"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug


      # ============================================================
      # 22. DEBUG APK CHECK
      # ============================================================

      - name: Validate Debug APK
        run: |
          set -e

          APK="$PROJECT_DIR/android_app/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "Debug APK was not created."

            exit 1

          fi

          echo "Debug APK:"
          ls -lh "$APK"

          echo
          echo "APK type:"

          file "$APK"

          echo
          echo "ARM64 libraries:"

          unzip -l "$APK" \
            | grep "lib/arm64-v8a/" \
            || true


      # ============================================================
      # 23. RELEASE BUILD
      # ============================================================

      - name: Build Release APK
        run: |
          set -e

          cd "$PROJECT_DIR/android_app"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease


      # ============================================================
      # 24. CHECK RELEASE APK
      # ============================================================

      - name: Validate ARM64 Release APK
        run: |
          set -e

          APK="$PROJECT_DIR/android_app/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then

            echo "Release APK was not created."

            exit 1

          fi

          echo "========================================"
          echo "RELEASE APK"
          echo "========================================"

          ls -lh "$APK"

          echo
          echo "File type:"

          file "$APK"

          echo
          echo "ARM64 library:"

          unzip -l "$APK" \
            | grep "lib/arm64-v8a/" \
            || true

          echo
          echo "DEX:"

          unzip -l "$APK" \
            | grep "classes.dex" \
            || true


      # ============================================================
      # 25. VERIFY ARM64 LIBRARY
      # ============================================================

      - name: Verify ARM64 Native Library
        run: |
          set -e

          APK="$PROJECT_DIR/android_app/app/build/outputs/apk/release/app-release.apk"

          rm -rf /tmp/apk_check

          mkdir -p /tmp/apk_check

          unzip -q \
            "$APK" \
            'lib/arm64-v8a/*' \
            -d /tmp/apk_check

          LIB="/tmp/apk_check/lib/arm64-v8a/libvoxelengine.so"

          if [ ! -f "$LIB" ]; then

            echo "ERROR: ARM64 library missing."

            exit 1

          fi

          echo "ARM64 native library found:"

          ls -lh "$LIB"

          file "$LIB"


      # ============================================================
      # 26. FINAL APK
      # ============================================================

      - name: Prepare Final APK
        run: |
          set -e

          APK="$PROJECT_DIR/android_app/app/build/outputs/apk/release/app-release.apk"

          cp \
            "$APK" \
            Minecraft_2.0_ARM64.apk

          echo "Final APK:"

          ls -lh Minecraft_2.0_ARM64.apk

          echo
          echo "SHA256:"

          sha256sum Minecraft_2.0_ARM64.apk


      # ============================================================
      # 27. UPLOAD
      # ============================================================

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-2.0-ARM64-APK
          path: Minecraft_2.0_ARM64.apk
          if-no-files-found: error
          retention-days: 30
