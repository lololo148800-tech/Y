name: VoxelVerse 2.0 — THE ULTIMATE BUILD

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Heavy APK (With Avatar & 417MB User Data)
    runs-on: ubuntu-latest
    # Используем официальный контейнер Godot для идеальной сборки APK
    container:
      image: barichello/godot-ci:4.3-stable

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Keystore (Fix Parse Error)
        run: |
          mkdir -p ~/.config/godot/
          mkdir -p ~/.local/share/godot/export_templates/
          # Создаем ключ для подписи, чтобы Android принял приложение
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Download Godot Core Engine
        run: |
          echo "Скачиваем чистое ядро движка..."
          curl -L -o engine.zip "https://files.manuscdn.com/user_upload_by_module/session_file/310519663886992990/qVefEYiLZWIVPvmJ.zip"
          unzip -q -o engine.zip -d project_root
          # Выносим файлы из подпапки в корень проекта
          if [ -d "project_root/VoxelVerse_Godot_Clean" ]; then
            mv project_root/VoxelVerse_Godot_Clean/* project_root/
          fi

      - name: Download User Master Data (417MB Link)
        run: |
          echo "Скачиваем твой гигантский архив (417 МБ) с промптами и v.txt..."
          curl -L -o userdata.zip "https://files.manuscdn.com/user_upload_by_module/session_file/310519663886992990/ajzjRwCScYByCokM.zip"
          mkdir -p project_root/assets/lore_and_ideas
          # Распаковываем твои данные прямо в ассеты игры для честного веса
          unzip -q -o userdata.zip -d project_root/assets/lore_and_ideas
          echo "Все твои идеи и v.txt успешно интегрированы в вес игры!"

      - name: Apply Your Cool Avatar
        run: |
          # ВАЖНО: Загрузи свою иконку в GitHub под именем icon.png
          if [ -f "icon.png" ]; then
            echo "Найдена твоя иконка! Вшиваем её в APK..."
            cp icon.png project_root/icon.png
          else
            echo "Иконка icon.png не найдена в твоем репозитории, используем стандартную."
          fi

      - name: Export Final APK
        run: |
          cd project_root
          mkdir -p build/android
          echo "Начинаем финальный экспорт тяжелого APK (200MB+)..."
          # Godot упакует твои 417МБ данных в оптимизированный пакет
          godot --headless --export-release "Android" build/android/VoxelVerse_Ultimate.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-2.0-User-Masterpiece-APK
          path: project_root/build/android/VoxelVerse_Ultimate.apk
          retention-days: 7
